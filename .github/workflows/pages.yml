name: Publicar vitrine no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Montar arquivos estáticos
        run: |
          mkdir -p _site/assets _site/imagens _site/css _site/js
          cp index.html admin.html _site/
          cp assets/* _site/assets/
          cp imagens/* _site/imagens/
          cp css/style.css _site/css/
          cp js/*.js _site/js/
      - name: Carregar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
